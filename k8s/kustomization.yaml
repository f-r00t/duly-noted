apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: duly-noted

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# newTag is rewritten by the release workflow after every image push.
# Argo CD picks up the change and rolls out the new image.
images:
  - name: ghcr.io/f-r00t/duly-noted
    newTag: latest
