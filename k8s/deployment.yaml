apiVersion: apps/v1
kind: Deployment
metadata:
  name: duly-noted
  labels:
    app: duly-noted
spec:
  # The database is a separate StatefulSet (postgres.yaml), so the
  # application is stateless: it can run several replicas and a release
  # replaces them one at a time without taking the service offline.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: duly-noted
  template:
    metadata:
      labels:
        app: duly-noted
    spec:
      containers:
        - name: app
          image: ghcr.io/f-r00t/duly-noted
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          # Readiness checks the database connection, so a new Pod only
          # receives traffic once it can reach PostgreSQL.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
