apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Only the application and the migration Job may open connections to the
  # database. Every other Pod in the cluster is refused.
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: duly-noted
        - podSelector:
            matchLabels:
              app: duly-noted-migrate
      ports:
        - protocol: TCP
          port: 5432
