<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Duly Noted</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f5f1;
        --card: #ffffff;
        --text: #1d1d1f;
        --muted: #77756f;
        --border: #dedcd5;
        --accent: #2f6f4f;
        --danger: #b3392f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181a;
          --card: #222326;
          --text: #ececec;
          --muted: #9a9a9a;
          --border: #36373b;
          --accent: #6fbf95;
          --danger: #e5766c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 48px 16px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 560px; margin: 0 auto; }
      h1 { margin: 0 0 4px; font-size: 28px; }
      .tagline { margin: 0 0 24px; color: var(--muted); }
      form { display: flex; gap: 8px; margin-bottom: 16px; }
      input[type="text"] {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: inherit;
        font: inherit;
      }
      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--card);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        margin-bottom: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
      }
      li span { flex: 1; overflow-wrap: anywhere; }
      li.completed span { color: var(--muted); text-decoration: line-through; }
      li input { width: 18px; height: 18px; accent-color: var(--accent); }
      li button { padding: 4px 10px; background: transparent; color: var(--danger); }
      #status { color: var(--muted); }
      #status.error { color: var(--danger); }
    </style>
  </head>
  <body>
    <main>
      <h1>Duly Noted</h1>
      <p class="tagline">A life changing todo list app</p>

      <form id="new-todo">
        <input type="text" id="title" placeholder="What needs doing?" maxlength="200" required autofocus />
        <button type="submit">Add</button>
      </form>

      <ul id="todos"></ul>
      <p id="status" role="status"></p>
    </main>

    <script>
      const list = document.getElementById('todos');
      const status = document.getElementById('status');
      const form = document.getElementById('new-todo');
      const titleInput = document.getElementById('title');

      async function api(method, url, body) {
        const res = await fetch(url, {
          method,
          headers: body ? { 'Content-Type': 'application/json' } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) {
          const { error } = await res.json().catch(() => ({}));
          throw new Error(error || `Request failed (${res.status})`);
        }
        return res.status === 204 ? null : res.json();
      }

      function render(todos) {
        list.replaceChildren(
          ...todos.map((todo) => {
            const item = document.createElement('li');
            item.classList.toggle('completed', todo.completed);

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = todo.completed;
            checkbox.setAttribute('aria-label', `Mark "${todo.title}" as done`);
            checkbox.addEventListener('change', () =>
              run(() => api('PATCH', `/api/todos/${todo.id}`, { completed: checkbox.checked })),
            );

            const title = document.createElement('span');
            title.textContent = todo.title;

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.textContent = 'Delete';
            remove.addEventListener('click', () => run(() => api('DELETE', `/api/todos/${todo.id}`)));

            item.append(checkbox, title, remove);
            return item;
          }),
        );
        status.className = '';
        status.textContent = todos.length ? '' : 'Nothing to do. Enjoy it while it lasts.';
      }

      // Runs an optional mutation, then reloads the list from the server.
      async function run(action) {
        try {
          if (action) await action();
          render(await api('GET', '/api/todos'));
        } catch (err) {
          status.className = 'error';
          status.textContent = err.message;
        }
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const title = titleInput.value.trim();
        if (!title) return;
        titleInput.value = '';
        run(() => api('POST', '/api/todos', { title }));
      });

      run();
    </script>
  </body>
</html>
